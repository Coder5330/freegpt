<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  #chat {
    width: 100%;
    max-width: 720px;
    height: 85vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 20px;
    font-weight: 600;
    font-size: 18px;
    border-bottom: 1px solid #eee;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #f0f0f3; color: #111; border-bottom-left-radius: 4px; }
  .placeholder { color: #999; text-align: center; margin-top: 40px; }
  .error { color: #c0392b; font-size: 14px; }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
    font-family: inherit;
  }
  button {
    padding: 0 18px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <div id="chat">
    <header>GPT Chat</header>
    <div id="messages"><p class="placeholder">Say something to get started.</p></div>
    <div id="inputRow">
      <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const SYSTEM_PROMPT = "You are a helpful assistant";
  let messages = [{ role: "system", content: SYSTEM_PROMPT }];

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function render() {
    messagesEl.innerHTML = "";
    const visible = messages.filter(m => m.role !== "system");
    if (visible.length === 0) {
      messagesEl.innerHTML = '<p class="placeholder">Say something to get started.</p>';
      return;
    }
    for (const m of visible) {
      const row = document.createElement("div");
      row.className = "row " + (m.role === "user" ? "user" : "bot");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.content;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showThinking() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "thinkingRow";
    row.innerHTML = '<div class="bubble">Thinking…</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideThinking() {
    document.getElementById("thinkingRow")?.remove();
  }

  function showError(msg) {
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = "Error: " + msg;
    messagesEl.appendChild(p);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    messages.push({ role: "user", content: text });
    inputEl.value = "";
    render();

    sendBtn.disabled = true;
    showThinking();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      hideThinking();

      if (!res.ok) throw new Error(data.error || "Request failed");

      messages.push({ role: "assistant", content: data.reply });
      render();
    } catch (e) {
      hideThinking();
      showError(e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
