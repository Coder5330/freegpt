<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GPT Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 960px;
    height: 85vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    overflow: hidden;
  }
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #fafafa;
    border-right: 1px solid #eee;
    display: flex;
    flex-direction: column;
  }
  #newChatBtn {
    margin: 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  #newChatBtn:hover { background: #f0f0f3; }
  #chatList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .chatItem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #333;
    margin-bottom: 2px;
  }
  .chatItem:hover { background: #eee; }
  .chatItem.active { background: #e0e7ff; color: #1e3a8a; font-weight: 600; }
  .chatTitle {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deleteBtn {
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .deleteBtn:hover { color: #c0392b; }

  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    padding: 16px 20px;
    font-weight: 600;
    font-size: 18px;
    border-bottom: 1px solid #eee;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #f0f0f3; color: #111; border-bottom-left-radius: 4px; }
  .placeholder { color: #999; text-align: center; margin-top: 40px; }
  .error { color: #c0392b; font-size: 14px; }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
    font-family: inherit;
  }
  button.action {
    padding: 0 18px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.action:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="newChatBtn">+ New chat</button>
      <div id="chatList"></div>
    </div>
    <div id="chat">
      <header id="chatHeader">GPT Chat</header>
      <div id="messages"></div>
      <div id="inputRow">
        <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="sendBtn" class="action">Send</button>
      </div>
    </div>
  </div>

<script>
  const SYSTEM_PROMPT = "You are a helpful assistant";
  const STORAGE_KEY = "gpt-chats-v1";

  function newChat() {
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: "New chat",
      messages: [{ role: "system", content: SYSTEM_PROMPT }],
    };
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.chats && parsed.chats.length) return parsed;
      }
    } catch (e) {
      console.warn("Couldn't read saved chats:", e);
    }
    const chat = newChat();
    return { chats: [chat], activeId: chat.id };
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Couldn't save chats:", e);
    }
  }

  let state = loadState();

  function getActiveChat() {
    return state.chats.find(c => c.id === state.activeId) || state.chats[0];
  }

  const chatListEl = document.getElementById("chatList");
  const messagesEl = document.getElementById("messages");
  const chatHeaderEl = document.getElementById("chatHeader");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function renderSidebar() {
    chatListEl.innerHTML = "";
    for (const c of state.chats) {
      const item = document.createElement("div");
      item.className = "chatItem" + (c.id === state.activeId ? " active" : "");

      const title = document.createElement("span");
      title.className = "chatTitle";
      title.textContent = c.title;
      title.addEventListener("click", () => {
        state.activeId = c.id;
        saveState();
        renderAll();
      });

      const del = document.createElement("button");
      del.className = "deleteBtn";
      del.textContent = "✕";
      del.title = "Delete chat";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteChat(c.id);
      });

      item.appendChild(title);
      item.appendChild(del);
      chatListEl.appendChild(item);
    }
  }

  function renderMessages() {
    const chat = getActiveChat();
    chatHeaderEl.textContent = chat.title;
    messagesEl.innerHTML = "";
    const visible = chat.messages.filter(m => m.role !== "system");
    if (visible.length === 0) {
      messagesEl.innerHTML = '<p class="placeholder">Say something to get started.</p>';
      return;
    }
    for (const m of visible) {
      const row = document.createElement("div");
      row.className = "row " + (m.role === "user" ? "user" : "bot");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = m.content;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderAll() {
    renderSidebar();
    renderMessages();
  }

  function showThinking() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "thinkingRow";
    row.innerHTML = '<div class="bubble">Thinking…</div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideThinking() {
    document.getElementById("thinkingRow")?.remove();
  }

  function showError(msg) {
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = "Error: " + msg;
    messagesEl.appendChild(p);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function deleteChat(id) {
    state.chats = state.chats.filter(c => c.id !== id);
    if (state.chats.length === 0) {
      state.chats = [newChat()];
    }
    if (state.activeId === id) {
      state.activeId = state.chats[0].id;
    }
    saveState();
    renderAll();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    const chat = getActiveChat();
    chat.messages.push({ role: "user", content: text });
    if (chat.title === "New chat") {
      chat.title = text.length > 30 ? text.slice(0, 30) + "…" : text;
    }
    inputEl.value = "";
    saveState();
    renderAll();

    sendBtn.disabled = true;
    showThinking();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chat.messages }),
      });
      const data = await res.json();
      hideThinking();

      if (!res.ok) throw new Error(data.error || "Request failed");

      chat.messages.push({ role: "assistant", content: data.reply });
      saveState();
      renderMessages();
    } catch (e) {
      hideThinking();
      showError(e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById("newChatBtn").addEventListener("click", () => {
    const chat = newChat();
    state.chats.unshift(chat);
    state.activeId = chat.id;
    saveState();
    renderAll();
  });

  renderAll();
</script>
</body>
</html>
